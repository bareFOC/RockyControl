[package]
name = "rk-rp2350"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Rocky Humanoid RP2350 firmware powered by embassy-rp + embassy-usb (CDC-ACM & USB Networking CDC-NCM)"

[features]
# Default Day-1 wired bring-up: USB CDC-ACM serial + onboard bench loopback servo plant.
# For wired USB Networking (Ethernet-over-USB UDP 10.42.0.2:7777):
#   cargo build --release --no-default-features --features usb-net,bench-loopback
default = ["usb-cdc", "bench-loopback"]
usb-cdc = []
usb-net = ["dep:embassy-net"]
bench-loopback = []
uart-servo-bus = []
imu-bno055 = []
# Opt-in high-rate ST LSM6DSV16X IMU on dedicated SPI1 (FIFO burst @ 200 Hz).
# Mutually exclusive with `imu-bno055`: BNO055 is not spawned when this is enabled.
imu-lsm6dsv = []
# Opt-in BareFOC multibus servo adapter (external PIO I3C driver via ServoBusHooks).
# `rk-multibus` is pulled in only for this feature so the default bench build
# stays free of the BareFOC register client.
i3c-servo-bus = ["dep:rk-multibus"]

[dependencies]
rk-proto = { path = "../../crates/rk-proto", default-features = false }
rk-control = { path = "../../crates/rk-control", default-features = false }
rk-fw-core = { path = "../rk-fw-core", default-features = false }
rk-multibus = { path = "../../crates/rk-multibus", default-features = false, optional = true }

# Embassy async embedded stack for RP2350 (Cortex-M33F)
embassy-rp = { version = "0.10.0", features = [
    "rp235xa",
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "binary-info",
    "executor-thread",
    "executor-interrupt",
] }
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-usb = { version = "0.6.0", features = ["defmt"] }
embassy-net = { version = "0.9.1", optional = true, features = [
    "defmt",
    "proto-ipv4",
    "udp",
    "medium-ethernet",
    "auto-icmp-echo-reply",
] }
embassy-futures = "0.1.2"

# Cortex-M33 runtime, logging & panics
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
static_cell = "2.1"
critical-section = "1.2"
spin = "0.12"
portable-atomic = { version = "1.11", default-features = false, features = ["require-cas", "float", "fallback"] }
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
