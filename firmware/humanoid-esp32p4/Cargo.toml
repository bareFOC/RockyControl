[package]
name = "humanoid-esp32p4"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Rocky Humanoid ESP32-P4 RISC-V board-support crate sharing 100% of humanoid-fw-core, copper-rs graph, and Embassy USB transport"

[workspace]

[features]
# Wired USB-OTG High-Speed (480 Mbps) CDC-ACM or CDC-NCM networking
default = ["usb-cdc", "bench-loopback"]
usb-cdc = []
usb-net = ["dep:embassy-net"]
bench-loopback = []
uart-servo-bus = []

[dependencies]
humanoid-proto = { path = "../../crates/humanoid-proto", default-features = false }
humanoid-control = { path = "../../crates/humanoid-control", default-features = false }
humanoid-fw-core = { path = "../humanoid-fw-core", default-features = false, features = ["copper"] }

cu29 = { version = "1.3", default-features = false, features = ["log-level-info", "textlogs"] }
bincode = { package = "cu-bincode", version = "2.2", default-features = false, features = ["derive", "alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }

# Espressif ESP32-P4 HAL + Embassy executor (RISC-V RV32IMAFC hardware FPU)
esp-hal = { version = "1.0.0-rc.0", features = ["esp32p4", "unstable"] }
esp-hal-embassy = { version = "0.9", features = ["esp32p4"] }
esp-alloc = "0.8"
esp-backtrace = { version = "0.17", features = ["esp32p4", "panic-handler", "println"] }
esp-println = { version = "0.15", features = ["esp32p4"] }

embassy-executor = "0.10"
embassy-time = "0.5"
embassy-usb = "0.6"
embassy-net = { version = "0.9", optional = true, features = ["proto-ipv4", "udp", "medium-ethernet", "auto-icmp-echo-reply"] }
static_cell = "2.1"
critical-section = "1.2"
spin = "0.12"

[build-dependencies]
cu29-build = "1.3"

[profile.release]
opt-level = "s"
debug = 2
lto = "thin"
panic = "abort"
