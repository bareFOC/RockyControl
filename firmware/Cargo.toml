[workspace]
resolver = "3"
members = [
    "humanoid-fw-core",
    "humanoid-rp2350",
]
# ESP32-P4 requires the RISC-V esp-hal toolchain (`riscv32imafc-unknown-none-elf`),
# so it remains standalone while sharing `humanoid-fw-core` and `firmware/copperconfig.ron`.
exclude = [
    "humanoid-esp32p4",
]

[profile.dev]
opt-level = 1
debug = 2

[profile.release]
opt-level = "s"
debug = 2
lto = "thin"
codegen-units = 1
panic = "abort"
