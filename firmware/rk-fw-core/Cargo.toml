[package]
name = "rk-fw-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Board-agnostic no_std Embassy humanoid firmware core (shared across RP2350 and ESP32-P4)"

[features]
default = ["std"]
std = [
    "rk-proto/std",
    "rk-control/std",
    "serde/std",
    "critical-section/std",
]
# Legacy no-op feature aliases retained for source compatibility with board crates that
# still request them. copper-rs (cu29) has been removed from the MCU runtime entirely.
copper = []
copper-defmt = []
copper-std = []

[dependencies]
rk-proto = { path = "../../crates/rk-proto", default-features = false }
rk-control = { path = "../../crates/rk-control", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
critical-section = { version = "1.2", default-features = false }
libm = "0.2"
