[package]
name = "rk-fw-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Board-agnostic no_std Copper-rs + Embassy humanoid firmware core (shared across RP2350 and ESP32-P4)"

[features]
default = ["std"]
std = [
    "rk-proto/std",
    "rk-control/std",
    "serde/std",
    "critical-section/std",
]
copper = [
    "dep:cu29",
    "dep:bincode",
    "bincode/alloc",
    "serde/alloc",
]
copper-defmt = ["copper", "cu29/defmt"]
copper-std = ["copper", "cu29/std", "bincode/std"]

[dependencies]
rk-proto = { path = "../../crates/rk-proto", default-features = false }
rk-control = { path = "../../crates/rk-control", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
critical-section = { version = "1.2", default-features = false }
libm = "0.2"

# Real Copper-rs (cu29) runtime integration (no_std + alloc compatible)
cu29 = { version = "1.3", default-features = false, features = ["log-level-info", "textlogs"], optional = true }
bincode = { package = "cu-bincode", version = "2.2", default-features = false, features = ["derive"], optional = true }
