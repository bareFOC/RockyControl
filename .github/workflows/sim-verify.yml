name: Simulation verification gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host + simulator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test all host workspace crates
        run: cargo test --workspace

  firmware-core:
    name: Shared firmware control application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test rk-fw-core
        run: cargo test --manifest-path firmware/Cargo.toml -p rk-fw-core

  thumb-matrix:
    name: RP2350 thumb feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Default bench build (usb-cdc + bench-loopback)
        run: cargo check --manifest-path firmware/rk-rp2350/Cargo.toml --target thumbv8m.main-none-eabihf
      - name: Hardware feature set (usb-net + i3c-servo-bus + imu-lsm6dsv)
        run: cargo check --manifest-path firmware/rk-rp2350/Cargo.toml --target thumbv8m.main-none-eabihf --no-default-features --features usb-net,i3c-servo-bus,imu-lsm6dsv
      - name: USB-Net bench build
        run: cargo check --manifest-path firmware/rk-rp2350/Cargo.toml --target thumbv8m.main-none-eabihf --no-default-features --features usb-net,bench-loopback

  wasm-check:
    name: WASM workstation cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check rk-ui for wasm32-unknown-unknown
        run: cargo check -p rk-ui --target wasm32-unknown-unknown

  experiments:
    name: Committed experiments + golden replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The fixtures are loaded through the confined-file `run_experiment` path
      # of the MCP headless host. Each test asserts exact_match, the recorded
      # tick count, walk-quality bounds and bit-exact golden-log replay.
      - name: Run acceptance experiments
        run: cargo test -p rk-mcp --lib acceptance_experiments -- --nocapture
