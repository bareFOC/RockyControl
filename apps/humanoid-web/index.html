<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Rocky Studio — Rust egui Humanoid Workstation</title>
    <link data-trunk rel="rust" data-bin="humanoid-web" data-wasm-opt="0" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        background: #0b0e14;
        color: #cbd5e1;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #rocky_canvas {
        display: block;
        width: 100vw;
        width: 100dvw;
        height: 100vh;
        height: 100dvh;
        touch-action: none;
      }
      #rocky_loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0e14;
        font-size: 14px;
        letter-spacing: 0.04em;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="rocky_loading">Loading Rocky Studio (Rust egui + WebGL2 WASM)...</div>
    <canvas id="rocky_canvas"></canvas>
  </body>
</html>
