name = "humanoid"
urdf = "humanoid.urdf"
z_up = true
pelvis_link = "base_link"
left_foot_link = "Foot_Left_1"
right_foot_link = "Foot_Right_1"
left_toe_link = "Toe_Left_1"
right_toe_link = "Toe_1"
imu_link = "Chest_1"
imu_mounting_rpy = [0.0, 0.0, 0.0]
foot_half_length_m = 0.035
foot_margin_m = 0.025
h_com_m = 0.25

[leg_geometry]
thigh_len = 0.108
shin_len = 0.090
hip_ankle_offset = 0.0
half_hip_spacing = 0.026
nominal_height = 0.195
min_height = 0.145
max_reach = 0.196
max_dx = 0.050
max_dy = 0.045
max_swing_dx = 0.070
max_swing_dy = 0.060
max_foot_lift = 0.035
max_sway = 0.025

# 28 actuators across 4 I3C buses:
#   bus 0: torso + neck/head (0..6)
#   bus 1: right leg (6..13)
#   bus 2: left leg (13..20)
#   bus 3: right + left arms (20..28)

[[actuators]]
urdf_joint = "waist_yaw"
role = "waist_yaw"
bus_id = 0
node_addr = 0x20
nm_per_amp = 0.9
max_torque_nm = 2.4
max_velocity_rad_s = 8.0

